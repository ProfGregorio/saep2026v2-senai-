
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Cadastro de Tutor - Clínica Veterinária</title>

    <link rel="stylesheet"
          th:href="@{/css/bootstrap/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<!-- MENU -->
<div th:replace="~{fragments/menu :: menu}"></div>

<main class="container py-5">

    <div class="row justify-content-center">
        <div class="col-12 col-lg-9">

            <div class="card border-0 shadow-sm">

                <div class="card-header bg-dark text-white p-4">
                    <h1 class="h4 mb-1">
                        Cadastro de Tutor
                    </h1>

                    <p class="mb-0">
                        Preencha os dados do responsável
                        pelo animal.
                    </p>
                </div>

                <div class="card-body p-4">

                    <!-- ERRO -->
                    <div th:if="${erro != null}"
                         class="alert alert-danger"
                         role="alert"
                         th:text="${erro}">
                    </div>

                    <!-- FORMULÁRIO -->
                    <form th:action="@{/tutores/cadastrar}"
                          th:object="${form}"
                          method="post">

                        <!-- DADOS PESSOAIS -->
                        <h2 class="h5 mb-3">
                            Dados pessoais
                        </h2>

                        <div class="row g-3">

                            <div class="col-12">
                                <label for="nome"
                                       class="form-label">
                                    Nome completo
                                </label>

                                <input type="text"
                                       th:field="*{nome}"
                                       class="form-control"
                                       maxlength="150"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label for="cpf"
                                       class="form-label">
                                    CPF
                                </label>

                                <input type="text"
                                       th:field="*{cpf}"
                                       class="form-control"
                                       maxlength="14"
                                       inputmode="numeric"
                                       placeholder="000.000.000-00"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label for="dataNasc"
                                       class="form-label">
                                    Data de nascimento
                                </label>

                                <input type="date"
                                       th:field="*{dataNasc}"
                                       class="form-control"
                                       required>
                            </div>

                            <div class="col-12">
                                <label for="email"
                                       class="form-label">
                                    E-mail de contato
                                </label>

                                <input type="email"
                                       th:field="*{email}"
                                       class="form-control"
                                       maxlength="150"
                                       required>
                            </div>

                        </div>

                        <hr class="my-4">

                        <!-- ENDEREÇO -->
                        <h2 class="h5 mb-3">
                            Endereço
                        </h2>

                        <div class="row g-3">

                            <div class="col-md-4">
                                <label for="cep"
                                       class="form-label">
                                    CEP
                                </label>

                                <input type="text"
                                       th:field="*{cep}"
                                       class="form-control"
                                       maxlength="9"
                                       inputmode="numeric"
                                       required>
                            </div>

                            <div class="col-md-8">
                                <label for="logradouro"
                                       class="form-label">
                                    Logradouro
                                </label>

                                <input type="text"
                                       th:field="*{logradouro}"
                                       class="form-control"
                                       maxlength="150"
                                       required>
                            </div>

                            <div class="col-md-4">
                                <label for="numero"
                                       class="form-label">
                                    Número
                                </label>

                                <input type="text"
                                       th:field="*{numero}"
                                       class="form-control"
                                       maxlength="10"
                                       required>
                            </div>

                            <div class="col-md-8">
                                <label for="complemento"
                                       class="form-label">
                                    Complemento
                                </label>

                                <input type="text"
                                       th:field="*{complemento}"
                                       class="form-control"
                                       maxlength="100">
                            </div>

                            <div class="col-md-5">
                                <label for="bairro"
                                       class="form-label">
                                    Bairro
                                </label>

                                <input type="text"
                                       th:field="*{bairro}"
                                       class="form-control"
                                       maxlength="100"
                                       required>
                            </div>

                            <div class="col-md-5">
                                <label for="cidade"
                                       class="form-label">
                                    Cidade
                                </label>

                                <input type="text"
                                       th:field="*{cidade}"
                                       class="form-control"
                                       maxlength="100"
                                       required>
                            </div>

                            <div class="col-md-2">
                                <label for="estado"
                                       class="form-label">
                                    UF
                                </label>

                                <input type="text"
                                       th:field="*{estado}"
                                       class="form-control text-uppercase"
                                       maxlength="2"
                                       placeholder="SP"
                                       required>
                            </div>

                        </div>

                        <!-- AÇÕES -->
                        <div class="d-flex flex-wrap gap-2
                                    justify-content-end mt-4">

                            <a th:href="@{/templates/admin/tutores}"
                               class="btn btn-outline-secondary">
                                Cancelar
                            </a>

                            <button type="submit"
                                    class="btn btn-primary">
                                Cadastrar Tutor
                            </button>

                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

</main>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/bootstrap/bootstrap.bundle.min.js}"></script>

</body>
</html>
