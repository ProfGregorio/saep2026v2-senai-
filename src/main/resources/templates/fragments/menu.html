<nav th:fragment="menu"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
     class="navbar navbar-expand-lg bg-dark navbar-dark">

    <div class="container">

        <!-- LOGOTIPO -->
        <a class="navbar-brand" th:href="@{/}">
            SAEP
        </a>

        <!-- BOTÃO MOBILE -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">

            <!-- MENU PRINCIPAL -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <!-- PÁGINAS PÚBLICAS -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">
                        Início
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/servicos}">
                        Serviços
                    </a>
                </li>

                <!-- ADMINISTRADOR -->
                <li class="nav-item"
                    sec:authorize="hasRole('ADMIN')">

                    <a class="nav-link" th:href="@{/dashboard}">
                        Dashboard
                    </a>
                </li>

                <!-- ADMINISTRADOR E FUNCIONÁRIO -->
                <li class="nav-item"
                    sec:authorize="hasAnyRole('ADMIN', 'FUNCIONARIO')">

                    <a class="nav-link" th:href="@{/templates/admin/tutores}">
                        Clientes
                    </a>
                </li>

                <!-- USUÁRIOS AUTENTICADOS -->
                <li class="nav-item"
                    sec:authorize="isAuthenticated()">

                    <a class="nav-link" th:href="@{/agendamentos}">
                        Agendamentos
                    </a>
                </li>

            </ul>

            <!-- USUÁRIO NÃO AUTENTICADO -->
            <div sec:authorize="!isAuthenticated()">

                <a class="btn btn-outline-light btn-sm"
                   th:href="@{/login}">
                    Entrar
                </a>

            </div>

            <!-- USUÁRIO AUTENTICADO -->
            <div sec:authorize="isAuthenticated()"
                 class="dropdown">

                <button class="btn btn-outline-light dropdown-toggle"
                        type="button"
                        id="menuUsuario"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">

                    Olá,
                    <span th:text="${session.nomeUsuario}">
                        Usuário
                    </span>

                </button>

                <ul class="dropdown-menu dropdown-menu-end"
                    aria-labelledby="menuUsuario">

                    <!-- PAINEL DO CLIENTE -->
                    <li sec:authorize="hasRole('CLIENTE')">

                        <a class="dropdown-item"
                           th:href="@{/cliente/painel}">
                            Meu Painel
                        </a>

                    </li>

                    <!-- NOVO AGENDAMENTO -->
                    <li sec:authorize="hasRole('CLIENTE')">

                        <a class="dropdown-item"
                           th:href="@{/agendamentos/novo}">
                            Novo agendamento
                        </a>

                    </li>

                    <!-- EDITAR DADOS DO CLIENTE -->
                    <li sec:authorize="hasRole('CLIENTE')">

                        <a class="dropdown-item"
                           th:href="@{/cliente/perfil}">
                            Editar meus dados
                        </a>

                    </li>

                    <!-- ÁREA ADMINISTRATIVA -->
                    <li sec:authorize="hasRole('ADMIN')">

                        <a class="dropdown-item"
                           th:href="@{/dashboard}">
                            Administração
                        </a>

                    </li>

                    <!-- ÁREA DO FUNCIONÁRIO -->
                    <li sec:authorize="hasRole('FUNCIONARIO')">

                        <a class="dropdown-item"
                           th:href="@{/admin/funcionarios/}">
                            Painel do funcionário
                        </a>

                    </li>

                    <!-- OPÇÕES GERAIS -->
<!--                    <li>-->
<!--                        <a class="dropdown-item"-->
<!--                           th:href="@{/perfil/editar}">-->
<!--                            Editar informações-->
<!--                        </a>-->
<!--                    </li>-->

                    <li>
                        <a class="dropdown-item"
                           th:href="@{/templates/admin/perfil/alterar-senha}">
                            Alterar senha
                        </a>
                    </li>

                    <li>
                        <hr class="dropdown-divider">
                    </li>

                    <!-- LOGOUT COM POST -->
                    <li>
                        <form th:action="@{/logout}"
                              method="post">

                            <button type="submit"
                                    class="dropdown-item text-danger">
                                Sair do sistema
                            </button>

                        </form>
                    </li>

                </ul>

            </div>

        </div>
    </div>
</nav>
